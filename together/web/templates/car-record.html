<sc-if value="{{is.record}}"><section class="screen record-screen" aria-label="주행 기록 상세"><div class="page-shell"><header class="page-heading"><div><p class="eyebrow">이동 완료</p><h1>{{seoul.dest}}</h1><p>{{detail.when}}</p></div><button class="btn bs" sc-camel-on-click="{{h.history}}">주행 기록 목록</button></header><div class="record-metrics"><div><span>주행 거리</span><strong>{{rec.km}} km</strong></div><div><span>주행 시간</span><strong>{{rec.duration}}</strong></div><div><span>출발 · 도착</span><strong>{{rec.started}} – {{rec.ended}}</strong></div></div><section class="record-people"><h2>함께 이동한 사람</h2><p>{{rec.who}}</p><sc-for list="{{rec.pickups}}" as="person"><div class="record-person"><strong>{{person.name}}</strong><span>{{person.place}}</span><time>{{person.time}}</time></div></sc-for></section><footer class="journey-footer"><button class="btn bs" sc-camel-on-click="{{h.home}}">홈으로</button></footer></div></section></sc-if>
