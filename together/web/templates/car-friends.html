<sc-if value="{{sh.addFriends}}"><aside class="side glass-sheet friend-picker" aria-label="친구 목록"><div class="sh"><h2>{{friendPicker.title}}</h2><button class="panel-close" sc-camel-on-click="{{h.close}}" aria-label="친구 목록 닫기">×</button></div><div class="sb">
<sc-if value="{{friendPicker.manage}}"><label class="lab" for="newFriendName">친구 등록</label><div class="search-input-row"><input id="newFriendName" class="inp" value="{{addName}}" sc-camel-on-change="{{h.onAddName}}" placeholder="친구 이름"><button class="btn bp" sc-camel-on-click="{{h.addPerson}}">등록</button></div></sc-if>
<p class="sheet-description">{{friendPicker.description}}</p><sc-for list="{{friendPicker.rows}}" as="friend"><button class="{{friend.cls}}" sc-camel-on-click="{{friend.toggle}}" aria-label="{{friend.aria}}" aria-pressed="{{friend.selected}}"><img class="portrait" src="{{friend.photo}}" alt=""><span><strong>{{friend.name}}</strong><small>{{friend.sub}}</small></span><sc-if value="{{friendPicker.pick}}"><span class="choice-check">{{friend.check}}</span></sc-if></button></sc-for><sc-if value="{{friendPicker.empty}}"><p class="empty-copy">등록된 친구가 없어요. 홈의 친구 관리에서 등록해 주세요.</p></sc-if></div><div class="sf"><sc-if value="{{friendPicker.pick}}"><button class="btn bs" sc-camel-on-click="{{h.close}}">취소</button><button class="btn bp" sc-camel-on-click="{{h.addSelectedFriends}}" disabled="{{friendPicker.disabled}}">{{friendPicker.cta}}</button></sc-if><sc-if value="{{friendPicker.manage}}"><button class="btn bp wide" sc-camel-on-click="{{h.close}}">완료</button></sc-if></div></aside></sc-if>
