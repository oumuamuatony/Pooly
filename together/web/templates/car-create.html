<sc-if value="{{is.create}}"><section class="screen create-screen" aria-label="{{form.title}}"><div class="create-panel pe">
<header><h1>{{form.title}}</h1><button class="panel-close" sc-camel-on-click="{{h.cancelForm}}" aria-label="일정 만들기 닫기">×</button></header>
<div class="create-body"><div class="create-field destination-field"><label>목적지</label><button class="pick destination-pick" sc-camel-on-click="{{h.fDest}}" aria-label="목적지 선택"><span aria-hidden="true">📍</span><span class="ellipsis">{{form.dest}}</span><span class="destination-chevron" aria-hidden="true">›</span></button></div>

<div class="create-field"><label>도착 일정</label><button class="pick" sc-camel-on-click="{{h.editMeeting}}" aria-label="약속 날짜와 시간">{{form.meetingLabel}}</button></div>
<div class="create-field members-field"><div class="members-label"><label>일행 추가</label><span>픽업할 일행 선택 · 최대 2명</span></div><div class="member-portraits"><sc-for list="{{fMembers}}" as="u"><div class="member-portrait"><button class="{{u.portraitClass}}" sc-camel-on-click="{{u.toggle}}" aria-label="{{u.pickupAria}}" aria-pressed="{{u.isPk}}"><img class="portrait" src="{{u.photo}}" alt=""><sc-if value="{{u.isPk}}"><span class="pickup-order">{{u.ord}}</span></sc-if></button><button class="member-name" sc-camel-on-click="{{u.focus}}">{{u.name}}</button></div></sc-for><button class="add-portrait" sc-camel-on-click="{{h.addFriend}}" aria-label="일행 추가">+</button></div></div>
<div class="pickup-preview-list" aria-label="픽업할 사람들"><sc-for list="{{pickupPeople}}" as="person"><div class="pickup-preview-row"><div class="pickup-person"><strong>{{person.name}}</strong><span>{{person.place}}</span></div><button sc-camel-on-click="{{person.preview}}" disabled="{{person.disabled}}" aria-label="{{person.aria}}">픽업 위치 보기</button></div></sc-for><sc-if value="{{noPickupPeople}}"><p class="pickup-empty">픽업할 일행을 선택해 주세요</p></sc-if></div>
</div><footer class="create-footer"><div class="create-estimate">{{draftEstimate}}</div><button class="btn bp create-submit" sc-camel-on-click="{{h.submit}}" disabled="{{busy}}">{{form.cta}}</button></footer>
<sc-if value="{{meetingPicker.open}}"><div class="meeting-picker" role="dialog" aria-label="약속 날짜와 시간 선택"><h2>도착 일정</h2><div class="calendar-month"><button sc-camel-on-click="{{h.previousMonth}}" aria-label="이전 달">‹</button><strong>{{meetingPicker.monthLabel}}</strong><button sc-camel-on-click="{{h.nextMonth}}" aria-label="다음 달">›</button></div><div class="calendar-week"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div><div class="calendar-days"><sc-for list="{{meetingPicker.days}}" as="day"><button class="{{day.cls}}" disabled="{{day.blank}}" sc-camel-on-click="{{day.choose}}" aria-label="{{day.label}}">{{day.text}}</button></sc-for></div><div class="meeting-time-controls"><div><button sc-camel-on-click="{{h.hourMinus}}" aria-label="한 시간 앞당기기">−</button><strong>{{meetingPicker.hour}}</strong><button sc-camel-on-click="{{h.hourPlus}}" aria-label="한 시간 늦추기">+</button></div><span>:</span><div><button sc-camel-on-click="{{h.minuteMinus}}" aria-label="5분 앞당기기">−</button><strong>{{meetingPicker.minute}}</strong><button sc-camel-on-click="{{h.minutePlus}}" aria-label="5분 늦추기">+</button></div></div><p>날짜를 고르고 도착 시간을 조절하세요</p><button class="btn bp wide" sc-camel-on-click="{{h.closeMeeting}}">확인</button></div></sc-if>
</div></section></sc-if>
