<sc-if value="{{is.moving}}"><section class="screen moving-screen" aria-label="이동 중"><div class="moving-panel pe"><header><strong>{{pickupPanel.title}}</strong><span>{{pickupPanel.remaining}}</span><button class="panel-close" sc-camel-on-click="{{h.dismissPanel}}" aria-label="알림 닫기">×</button></header><p class="notice-copy">{{pickupPanel.message}}</p><sc-if value="{{pickupPanel.canCall}}"><button class="btn call-button" sc-camel-on-click="{{h.callPickup}}">전화하기</button></sc-if><div class="notice-progress" role="progressbar" aria-label="7초 후 알림 닫힘"><i></i></div></div><div class="guidance-status pe"><h1>차량 내비에서 안내 중이에요</h1><p>필요한 알림은 내비 위에 잠시 표시돼요</p><div><button class="btn bs" sc-camel-on-click="{{h.returnJourney}}">여정 확인</button><button class="btn bp" sc-camel-on-click="{{h.openNavigation}}">내비 열기</button></div></div></section></sc-if>
