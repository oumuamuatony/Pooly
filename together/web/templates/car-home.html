<sc-if value="{{is.home}}"><section class="screen" aria-label="홈"><div class="full"><div class="home home-v2">
<div class="evs">
<sc-if value="{{hasEvents}}"><header class="home-heading"><h1>일정</h1><button class="btn bp" sc-camel-on-click="{{h.create}}">일정 만들기</button></header>
<div class="appointment-list"><sc-for list="{{cards}}" as="c"><article class="appointment-card">
<h2>{{c.dest}}</h2><div class="appointment-when"><span>약속 날짜 및 시간</span><strong>{{c.dateLabel}}　{{c.timeLabel}}</strong></div>
<div class="appointment-people"><div class="portrait-stack"><sc-for list="{{c.avs}}" as="u"><img class="portrait" src="{{u.photo}}" alt="{{u.name}}"></sc-for></div><span>{{c.peopleLabel}}</span></div>
<div class="appointment-actions"><button class="btn depart-button" sc-camel-on-click="{{c.depart}}" disabled="{{c.departDisabled}}">{{c.departLabel}}</button><button class="btn journey-button" sc-camel-on-click="{{c.act}}">여정 확인</button></div>
</article></sc-for></div><footer class="home-footer"><button sc-camel-on-click="{{h.openConnect}}">기기·권한</button></footer></sc-if>
<sc-if value="{{noEvents}}"><div class="home-empty"><div class="empty-portraits" aria-hidden="true"><img src="assets/profiles/empty-left.png"><img src="assets/profiles/kelly.png"><img src="assets/profiles/jeff.png"></div><h1>아직 일정이 없습니다!</h1><p>일정을 만들고 친구들을 초대하세요</p><button class="btn bp" sc-camel-on-click="{{h.create}}">일정 만들기</button></div></sc-if>
</div>
<sc-if value="{{hasEvents}}"><aside class="friends" aria-label="친구"><header><h2>친구</h2><button sc-camel-on-click="{{h.manageFriends}}">관리</button></header><div class="friend-list"><sc-for list="{{friends}}" as="f"><button class="friend-row" sc-camel-on-click="{{f.open}}"><img class="portrait" src="{{f.photo}}" alt=""><span>{{f.name}}</span></button></sc-for></div></aside></sc-if>
</div></div></section></sc-if>
