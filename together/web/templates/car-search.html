<sc-if value="{{is.search}}"><section class="screen search-screen" aria-label="목적지 검색"><div class="create-panel search-panel pe">
<header><button class="back-button" sc-camel-on-click="{{h.searchBack}}" aria-label="일정으로 돌아가기">‹</button><h1>목적지 검색</h1></header>
<div class="search-input-row"><input id="placeQ" class="inp" aria-label="목적지 검색어" value="{{destinationSearch.q}}" sc-camel-on-change="{{h.onQ}}" sc-camel-on-key-down="{{h.destinationSearchKey}}" placeholder="장소나 주소를 입력하세요"><button class="btn bp" sc-camel-on-click="{{h.searchRemote}}">검색</button></div>
<p class="search-source">{{destinationSearch.source}}</p>
<div class="search-result-list"><sc-if value="{{destinationSearch.loading}}"><p class="empty-copy">검색 중…</p></sc-if><sc-for list="{{destinationSearch.rows}}" as="place"><button class="{{place.cls}}" sc-camel-on-click="{{place.choose}}" aria-label="{{place.aria}}"><span class="place-pin" aria-hidden="true">⌖</span><span><strong>{{place.name}}</strong><small>{{place.address}}</small><em>{{place.source}}</em></span><span class="choice-check" aria-hidden="true">{{place.check}}</span></button></sc-for><sc-if value="{{destinationSearch.empty}}"><div class="empty-copy"><strong>검색 결과가 없어요</strong><p>{{destinationSearch.emptyMessage}}</p></div></sc-if></div>
<footer class="create-footer"><sc-if value="{{destinationSearch.hasSelection}}"><div class="selected-place"><strong>{{destinationSearch.selectedName}}</strong><span>{{destinationSearch.selectedAddress}}</span></div></sc-if><button class="btn bp create-submit" sc-camel-on-click="{{h.chooseDestination}}" disabled="{{destinationSearch.disabled}}">목적지로 설정</button></footer>
</div></section></sc-if>
