<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F6F3F2">
<title>Pooly — 함께 만나는 가장 편한 방법</title>
<link rel="icon" href="assets/pooly-web-icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="vendor/maplibre/maplibre-gl.css">
<link rel="stylesheet" href="mobile-web.css">
<script defer src="vendor/maplibre/maplibre-gl.js"></script>
<script defer src="mobile-web.js"></script>
</head>
<body>
<div class="web-layout">
  <aside class="desktop-story" aria-label="Pooly 소개">
    <a class="wordmark" href="phone.html" aria-label="Pooly 홈">pooly<span>↗</span></a>
    <p class="eyebrow">A LITTLE CLOSER, TOGETHER.</p>
    <h1>어디서 만날지,<br>이제 정해볼까요?</h1>
    <p class="story-copy">내가 편한 곳을 고르면,<br>친구는 그곳으로 찾아와요.</p>
    <div class="story-route" aria-hidden="true"><span>YOU</span><i></i><span class="car-symbol">↗</span><i></i><span>TOGETHER</span></div>
    <div class="story-people"><img src="assets/profiles/max.png" alt=""><img src="assets/profiles/kelly.png" alt=""><img src="assets/profiles/jeff.png" alt=""><span>만나러 가는 시간도, 함께.</span></div>
    <p class="web-caption">설치 없이, 초대 링크로 시작하는 Pooly 웹</p>
  </aside>
  <main id="mobileApp" class="mobile-app" aria-label="Pooly 모바일 웹">
    <header class="app-header"><button class="logo-button" data-action="home" aria-label="Pooly 홈">pooly<span>↗</span></button><div class="header-right"><button class="avatar-mini" data-action="profile" aria-label="내 정보"><img src="assets/profiles/kelly.png" alt="내 프로필"></button></div></header>
    <div id="screen" class="screen" tabindex="-1"><div class="loading"><span class="loading-dot"></span><p>약속을 불러오고 있어요.</p></div></div>
    <nav id="bottomNav" class="bottom-nav" aria-label="주 메뉴"></nav>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <div id="sheetRoot"></div>
  </main>
  <aside class="preview-tools" id="previewTools" aria-label="웹 프로토타입 시연">
    <div><span class="eyebrow">TRY THE PROTOTYPE</span><h2>직접 둘러보세요</h2><p>예시 데이터로 화면 흐름을 체험할 수 있어요.</p></div>
    <div class="tool-section"><span class="tool-label">화면 역할</span><div class="role-segment"><button data-action="role-rider" aria-pressed="true">픽업받는 사람</button><button data-action="role-driver" aria-pressed="false">운전자</button></div><p class="tool-note">픽업 위치는 픽업받는 사람만 정해요.<br>운전자는 공유된 위치를 확인해요.</p></div>
    <div class="tool-section"><label class="tool-label" for="demoStage">시연 상태</label><select id="demoStage"><option value="idle">출발 전</option><option value="driving">운전자가 오는 중</option><option value="arrived">픽업 장소 도착</option><option value="boarded">승차 완료</option><option value="finished">여정 완료</option></select><p class="tool-note">상태 변경은 이 미리보기에만 적용돼요.</p></div>
    <button class="text-button reset-demo" data-action="reset-demo">처음부터 다시 보기 ↻</button>
  </aside>
</div>
<noscript><p>Pooly를 사용하려면 브라우저에서 자바스크립트를 허용해 주세요.</p></noscript>
</body>
</html>
