<sc-if value="{{is.history}}"><section class="screen history-screen" aria-label="주행 기록"><div class="page-shell"><header class="page-heading"><div><h1>주행 기록</h1><p>함께 이동한 여정을 확인하세요</p></div></header><sc-if value="{{hasHistory}}"><div class="history-layout"><div class="history-list"><sc-for list="{{hist}}" as="record"><button class="{{record.cls}}" sc-camel-on-click="{{record.pick}}"><span>{{record.date}}</span><strong>{{record.name}}</strong><small>{{record.km}} · {{record.min}} · {{record.people}}</small></button></sc-for></div><article class="history-summary"><span>{{hsel.date}} · {{hsel.time}}</span><h2>{{hsel.name}}</h2><p>{{hsel.route}}</p><div class="record-metrics"><div><span>주행 거리</span><strong>{{hsel.km}}</strong></div><div><span>주행 시간</span><strong>{{hsel.min}}</strong></div><div><span>함께한 인원</span><strong>{{hsel.people}}</strong></div></div><button class="btn bp" sc-camel-on-click="{{h.histOpen}}">기록 자세히 보기</button></article></div></sc-if><sc-if value="{{noHistory}}"><div class="page-empty"><h2>아직 주행 기록이 없습니다</h2><p>이동을 완료하면 여기에 기록돼요</p><button class="btn bp" sc-camel-on-click="{{h.home}}">홈으로</button></div></sc-if></div></section></sc-if>
